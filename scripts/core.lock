# The core: the router downloads it on its own from CORE_REPO's releases, the stable ones of its
# line CORE_LINE (tagged "<line>-vX.Y.Z"; the repository also carries mihomo's own v* tags), and
# knows and shows a release by its version alone. packaging/openwrt/build-runtime.sh links both
# into the manager (internal/kernel Repository and ReleaseLine).
CORE_REPO=openweir/mihomo
CORE_LINE=openweir
# The release the tests run on loopback (packaging/openwrt/fetch-core.sh), pinned by SHA-256.
# To update: set CORE_TAG and every line of CORE_SHA256 from the release's sha256sums.
CORE_TAG=v1.0.1
CORE_RELEASE=$CORE_LINE-$CORE_TAG
