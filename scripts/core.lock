# Router core: mihomo built from a pinned source commit, trimmed to the
# protocols hyper uses (scripts/mihomo-trim.mjs) and bundled into the package.
# The router never downloads the core.
# To update: change MIHOMO_TAG, MIHOMO_COMMIT (full) and MIHOMO_SOURCE_SHA256 together,
# then run `node --test tests/stage_binaries.test.mjs` (it also covers scripts/mihomo-trim.mjs).
MIHOMO_REPO=openweir/mihomo
MIHOMO_TAG=openweir-v1.0.0
MIHOMO_COMMIT=7d3383e170ce4f096fb70ffd74ab86318f9137c3
MIHOMO_SOURCE_SHA256=f425f4d378079cbf27ecd01fc96e1ed8ced12d64375f5e3ada89bb3b88203936
# Drop tailscale/zerotier/easytier/fake-tcp; no naive (cronet) and no gvisor (TUN uses the system stack).
MIHOMO_TAGS=no_tailscale,no_zerotier,no_easytier,no_fake_tcp,with_low_memory
GO_TOOLCHAIN=go1.25.5
