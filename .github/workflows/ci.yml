name: CI

# Build and test OpenWrt packages. Release on qualifying main commits or v* tags.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'openwrt-main' || format('ci-{0}', github.run_id) }}

jobs:
  test:
    name: Tests (hyperd, scripts, core renders)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.release-version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}

      - name: Validate the release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh scripts/release/validate-tag.sh "$RELEASE_TAG"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/release/package-lock.json

      - name: Determine the next release from commit messages
        id: release-version
        if: github.ref == 'refs/heads/main'
        run: |
          npm --prefix scripts/release ci --ignore-scripts
          tag="$(node scripts/release/version.mjs)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y nftables

      # GPL-2.0-only HomeProxy code is gone; nothing may bring it back. The bracket keeps
      # this step from matching its own text.
      - name: No HomeProxy-derived files
        run: |
          if git grep -nI 'ImmortalWrt[.]org' -- .; then
            echo "::error::HomeProxy's copyright line found in the repository"; exit 1
          fi

      - name: Script tests
        run: |
          node --test tests/build_scripts.test.mjs tests/stage_binaries.test.mjs tests/proxy_conflicts.test.mjs
          node scripts/bundled-rules.mjs

      # Real nftables and iproute2 in a throwaway network namespace (root: the runner
      # restricts unprivileged user namespaces).
      - name: Network helper
        run: sudo sh tests/network_test.sh

      - name: Read the core build settings
        id: go-toolchain
        run: |
          . scripts/core.lock
          echo "version=${GO_TOOLCHAIN#go}" >> "$GITHUB_OUTPUT"
          target="$(sh scripts/stage-binaries.sh --target-id x86_64)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Restore the exact core binaries
        id: core-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/core
          key: router-core-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.target }}-${{ hashFiles('scripts/core.lock', 'scripts/stage-binaries.sh', 'scripts/mihomo-trim.mjs', 'go.mod', 'go.sum', 'cmd/**', 'internal/**') }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.go-toolchain.outputs.version }}
          cache-dependency-path: |
            go.sum
            scripts/core.lock

      - name: hyperd tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...

      - name: Build the amd64 core and hyperd
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: OUT_DIR=/tmp/core sh scripts/stage-binaries.sh x86_64

      # Always validate cached binaries too. The very same amd64 pair is shared
      # with both SDK builds only after the real core startup tests pass.
      - name: Validate and start the bundled core
        run: |
          /tmp/core/mihomo -v
          /tmp/core/hyperd version
          MIHOMO=/tmp/core/mihomo sh tests/render_test.sh

      # The real hyperd, mihomo and network helper together: takeover, fail open when the
      # core dies, restore when it returns, release on stop. As real root, so the core's
      # identity (root in the core group alone, as OpenClash's) and limits are checked too.
      - name: End-to-end
        run: |
          HYPER_E2E_ROOT=1 HYPERD=/tmp/core/hyperd MIHOMO=/tmp/core/mihomo sh tests/e2e_test.sh
          HYPER_E2E_ROOT=1 E2E_METHOD=tun HYPERD=/tmp/core/hyperd MIHOMO=/tmp/core/mihomo sh tests/e2e_test.sh

      - name: Archive the tested core binaries
        run: tar -C /tmp/core -cf "$RUNNER_TEMP/core.tar" mihomo hyperd

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ steps.go-toolchain.outputs.target }}
          path: ${{ runner.temp }}/core.tar
          compression-level: 1
          if-no-files-found: error

  web:
    name: Build and test the web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI into the package
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web test
          npm --prefix web run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui
          path: luci-app-hyper/htdocs/luci-static/hyper/
          if-no-files-found: error

  cores:
    name: Core ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One representative package arch per binary profile; amd64 is produced
        # by test. stage-binaries.sh owns the package-arch to profile mapping.
        arch:
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - mipsel_24kc
          - i386_pentium4
          - riscv64_generic
          - loongarch64_generic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the core build settings
        id: go-toolchain
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          . scripts/core.lock
          echo "version=${GO_TOOLCHAIN#go}" >> "$GITHUB_OUTPUT"
          target="$(sh scripts/stage-binaries.sh --target-id "$MATRIX_ARCH")"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Restore the exact core binaries
        id: core-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/core
          key: router-core-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-toolchain.outputs.target }}-${{ hashFiles('scripts/core.lock', 'scripts/stage-binaries.sh', 'scripts/mihomo-trim.mjs', 'go.mod', 'go.sum', 'cmd/**', 'internal/**') }}

      # A final-binary hit needs no Go toolchain or module cache download. Cold
      # builds retain the shared Go cache rather than storing seven large copies.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          go-version: ${{ steps.go-toolchain.outputs.version }}
          cache-dependency-path: |
            go.sum
            scripts/core.lock

      - name: Build the core and hyperd
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: OUT_DIR=/tmp/core sh scripts/stage-binaries.sh "$MATRIX_ARCH"

      - name: Archive the core binaries
        run: |
          test -x /tmp/core/mihomo
          test -x /tmp/core/hyperd
          tar -C /tmp/core -cf "$RUNNER_TEMP/core.tar" mihomo hyperd

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ steps.go-toolchain.outputs.target }}
          path: ${{ runner.temp }}/core.tar
          compression-level: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.arch }}
    needs: [test, web, cores]
    runs-on: ubuntu-24.04
    # Builds take a few minutes. A stalled SDK pull takes four bounded attempts and their
    # pauses (about 15 minutes), a stalled feed update three (about 16): room for either and
    # the rest of the run, so a stall fails as a retried download, not a job timeout.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # <package arch>-<OpenWrt SDK>. Like passwall's releases, each entry gives ONE
        # package for that CPU: the 24.10 SDK builds the 23.05-24.10 .ipk, the 25.12
        # SDK the 25.12+ .apk. The package bundles hyperd and the mihomo core.
        # SDK images: ghcr.io/openwrt/sdk:<arch>-<release> (every tag below exists);
        # scripts/build-packages.sh does the same locally. CI shares the web UI
        # and seven binary profiles across these 22 SDK packages. riscv64 is
        # riscv64_riscv64 in 24.10 and riscv64_generic from 25.12.
        arch:
          - x86_64-24.10.8
          - aarch64_cortex-a53-24.10.8
          - aarch64_cortex-a72-24.10.8
          - aarch64_generic-24.10.8
          - arm_cortex-a7_neon-vfpv4-24.10.8
          - arm_cortex-a9_vfpv3-d16-24.10.8
          - arm_cortex-a15_neon-vfpv4-24.10.8
          - mipsel_24kc-24.10.8
          - i386_pentium4-24.10.8
          - riscv64_riscv64-24.10.8
          - loongarch64_generic-24.10.8
          - x86_64-25.12.6
          - aarch64_cortex-a53-25.12.6
          - aarch64_cortex-a72-25.12.6
          - aarch64_generic-25.12.6
          - arm_cortex-a7_neon-vfpv4-25.12.6
          - arm_cortex-a9_vfpv3-d16-25.12.6
          - arm_cortex-a15_neon-vfpv4-25.12.6
          - mipsel_24kc-25.12.6
          - i386_pentium4-25.12.6
          - riscv64_generic-25.12.6
          - loongarch64_generic-25.12.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set the package version for the release
        env:
          RELEASE_TAG: ${{ needs.test.outputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${RELEASE_TAG#v}/" luci-app-hyper/Makefile
          fi

      - name: Select the shared core profile
        id: core-target
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          target="$(sh scripts/stage-binaries.sh --target-id "${MATRIX_ARCH%-*}")"
          echo "id=$target" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui
          path: luci-app-hyper/htdocs/luci-static/hyper/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-${{ steps.core-target.outputs.id }}
          path: ${{ runner.temp }}/core-artifact

      - name: Stage the shared binaries
        run: |
          mkdir -p luci-app-hyper/root/usr/libexec/hyper/bin
          tar -xf "$RUNNER_TEMP/core-artifact/core.tar" -C luci-app-hyper/root/usr/libexec/hyper/bin
          test -x luci-app-hyper/root/usr/libexec/hyper/bin/mihomo
          test -x luci-app-hyper/root/usr/libexec/hyper/bin/hyperd
          test -f luci-app-hyper/htdocs/luci-static/hyper/index.html

      - name: Build package
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        # The official SDK already has the cross tools. Run it directly and
        # package the prebuilt app using its own rules, with no wrapper image,
        # QEMU setup or compilation of runtime dependencies.
        run: |
          output="$RUNNER_TEMP/sdk-artifacts"
          sudo install -d -o 1000 -g 1000 "$output"
          epoch="$(git log -1 --format=%ct)"
          # The SDK pull is retried, each attempt bounded at three minutes so a stalled one is
          # retried instead of running into the job's timeout; the build itself never is.
          for wait in 10 20 40 0; do
            timeout -k 30 180 docker pull --platform linux/amd64 "ghcr.io/openwrt/sdk:$MATRIX_ARCH" && break
            [ "$wait" -gt 0 ] || exit 1
            sleep "$wait"
          done
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh \
            -e SOURCE_DATE_EPOCH="$epoch" \
            -v "$GITHUB_WORKSPACE:/feed:ro" \
            -v "$output:/artifacts" \
            "ghcr.io/openwrt/sdk:$MATRIX_ARCH" /feed/scripts/ci-sdk-build.sh
          mkdir -p bin
          cp -R "$output/bin/." bin/

      - name: Collect
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          pkg_arch="${MATRIX_ARCH%-*}"
          case "${MATRIX_ARCH##*-}" in 2[0-4].*) family="23.05-24.10" ;; *) family="25.12+" ;; esac
          mkdir -p dist
          for f in $(find bin/packages -path '*/hyper/*' \( -name 'luci-app-hyper*.ipk' -o -name 'luci-app-hyper*.apk' \)); do
            name="$(basename "$f")"
            out="dist/$(sh scripts/package-name.sh "$name" "$family" "$pkg_arch")"
            case "$name" in
              *.ipk) tar -xzOf "$f" --wildcards '*data.tar.gz' | tar -tzf - | grep -q 'usr/libexec/hyper/bin/mihomo$' \
                       || { echo "::error::$name does not contain the bundled core"; exit 1; }
                     # the core inside is for one CPU: an "all" package would install anywhere
                     arch="$(tar -xzOf "$f" --wildcards '*control.tar.gz' | tar -xzOf - --wildcards '*/control' | sed -n 's/^Architecture: //p')"
                     [ "$arch" = "$pkg_arch" ] || { echo "::error::$name is built for '$arch', not $pkg_arch"; exit 1; } ;;
              *.apk) [ "$(stat -c %s "$f")" -gt 10000000 ] || { echo "::error::$name is too small to contain the bundled core"; exit 1; } ;;
            esac
            cp "$f" "$out"
          done
          ls -la dist
          [ "$(ls dist | wc -l)" -eq 1 ] || { echo "::error::expected exactly one package"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          compression-level: 0

  # Install the packages on the oldest and newest firmware of each family (rootfs
  # from downloads.openwrt.org) and test on that userland: the dependencies resolve,
  # the bundled programs run, the upgrade migration works, rpcd serves luci.hyper
  # through hyperd, and the network rules load on the firmware's nftables.
  # Both CPUs run natively. QEMU user-mode cannot exercise every Linux socket
  # option used by the routing marks in the core startup test.
  # armsr/armv8 uses the same arm64 core as every aarch64_* package.
  install-test:
    name: Install on OpenWrt ${{ matrix.release }} (${{ matrix.cpu }})
    needs: build
    runs-on: ${{ matrix.cpu == 'aarch64_generic' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Runs take a few minutes. A stalled rootfs download takes five bounded attempts and
    # their pauses (about 11 minutes) before it fails, and the package feeds are retried
    # too (router-test.sh): room for both and the rest of the run.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: 23.05.6, cpu: x86_64, target: x86/64, platform: linux/amd64, packages: packages-x86_64-24.10.8 }
          - { release: 24.10.8, cpu: x86_64, target: x86/64, platform: linux/amd64, packages: packages-x86_64-24.10.8 }
          - { release: 25.12.6, cpu: x86_64, target: x86/64, platform: linux/amd64, packages: packages-x86_64-25.12.6 }
          - { release: 23.05.6, cpu: aarch64_generic, target: armsr/armv8, platform: linux/arm64, packages: packages-aarch64_generic-24.10.8 }
          - { release: 24.10.8, cpu: aarch64_generic, target: armsr/armv8, platform: linux/arm64, packages: packages-aarch64_generic-24.10.8 }
          - { release: 25.12.6, cpu: aarch64_generic, target: armsr/armv8, platform: linux/arm64, packages: packages-aarch64_generic-25.12.6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.packages }}
          path: pkg

      - name: OpenWrt ${{ matrix.release }} ${{ matrix.target }} rootfs
        env:
          RELEASE: ${{ matrix.release }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        # Retried (to a file, so a retry never feeds docker a torn stream): one failed
        # download should not hold back the release. The rootfs is a few MB; each attempt is
        # bounded at two minutes so a stalled one is retried within the job's timeout.
        run: |
          curl -fsSL --retry 4 --retry-delay 10 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/rootfs.tar.gz" \
            "https://downloads.openwrt.org/releases/$RELEASE/targets/$TARGET/openwrt-$RELEASE-${TARGET//\//-}-rootfs.tar.gz"
          docker import --platform "$PLATFORM" "$RUNNER_TEMP/rootfs.tar.gz" "openwrt-rootfs:$RELEASE"

      - name: Install the package and run the tests
        env:
          RELEASE: ${{ matrix.release }}
          PLATFORM: ${{ matrix.platform }}
        run: sh tests/router-test.sh "openwrt-rootfs:$RELEASE" pkg/* "$PLATFORM"

  release:
    name: GitHub Release
    if: needs.test.outputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, build, install-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: openwrt-release-${{ needs.test.outputs.release_tag || github.ref_name }}
    env:
      RELEASE_TAG: ${{ needs.test.outputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the release target
        id: release-target
        run: sh scripts/release/check-target.sh

      # One directory per build: merged into one folder, two packages with the
      # same name would overwrite each other without a word (v0.1.0 lost ten ipks).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release-target.outputs.publish == 'true'
        with:
          path: built
          pattern: packages-*

      - name: Collect and checksum
        if: steps.release-target.outputs.publish == 'true'
        run: |
          builds="$(find built -mindepth 1 -maxdepth 1 -type d -name 'packages-*' | wc -l)"
          dupes="$(find built -type f -printf '%f\n' | sort | uniq -d)"
          [ -z "$dupes" ] || { echo "::error::packages with the same name from different builds: $dupes"; exit 1; }
          mkdir -p artifacts
          find built -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} artifacts/ \;
          count="$(find artifacts -type f | wc -l)"
          [ "$count" -eq "$builds" ] || { echo "::error::$builds builds but $count packages"; exit 1; }
          cd artifacts
          ls -la
          sha256sum *.ipk *.apk > sha256sums
          cat sha256sums

      - name: Recheck main before publishing
        id: publish-target
        if: steps.release-target.outputs.publish == 'true'
        run: sh scripts/release/check-target.sh

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: steps.publish-target.outputs.publish == 'true'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.publish-target.outputs.commit }}
          files: |
            artifacts/*.ipk
            artifacts/*.apk
            artifacts/sha256sums
          generate_release_notes: true
          fail_on_unmatched_files: true
